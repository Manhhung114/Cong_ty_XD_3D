plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.congtyxd3d.app'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.congtyxd3d.app'
        minSdk 24
        targetSdk 35
        versionCode 63
        versionName '5.7.8-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        stableRelease {
            def path = System.getenv('ANDROID_SIGNING_KEYSTORE_PATH')
            if (path) storeFile file(path)
            storePassword System.getenv('ANDROID_SIGNING_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('ANDROID_SIGNING_KEY_ALIAS') ?: ''
            keyPassword System.getenv('ANDROID_SIGNING_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.stableRelease
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
