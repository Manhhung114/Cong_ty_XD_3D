plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.congtyxd3d.app'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.congtyxd3d.app'
        minSdk 24
        targetSdk 35
        versionCode 53
        versionName '5.3.0-demo'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
