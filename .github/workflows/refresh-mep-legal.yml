name: Discover Official Legal and TCVN Sources – XD & MEP
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Search official portals; only unverified candidate links
        run: python scripts/refresh_legal_candidates.py
      - name: Commit only candidate links, not approved legal catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legal/MEP_XD_source_candidates.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(legal): refresh unverified legal candidates for XD and MEPF'
          git push
