name: Build Android APK - XD MEP AI 3D

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.XD_MEP_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.XD_MEP_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.XD_MEP_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.XD_MEP_KEY_PASSWORD }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: pip install -r backend/requirements.txt pytest httpx
      - name: Test server authorization / project isolation / approvals
        run: python -m pytest backend/tests -q
      - name: Package offline web application
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/
          cp -r src data assets android/app/src/main/assets/www/
          rm -rf android/app/src/main/assets/www/data/samples
      - name: Test web application
        run: npm test
      - name: Restore private release keystore from GitHub Secrets
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_ALIAS != '' && env.RELEASE_KEY_PASSWORD != '' }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xd-mep-stable-release.p12"
          echo "ANDROID_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/xd-mep-stable-release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK (reusable signing key)
        if: ${{ env.ANDROID_SIGNING_KEYSTORE_PATH != '' }}
        run: gradle --no-daemon --stacktrace -p android :app:assembleRelease
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug
      - name: Verify output and SHA256
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cong_ty_XD_3D_V5_7_4_Android_Debug_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload stable signed APK (only when release secrets are configured)
        if: ${{ env.ANDROID_SIGNING_KEYSTORE_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Cong_ty_XD_3D_V5_7_4_Signed_Release_APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
