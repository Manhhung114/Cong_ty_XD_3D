name: Publish Web 3D (Pages)

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'src/**'
      - 'assets/**'
      - 'data/legal/**'
      - 'data/templates/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify web application
        run: node --test tests/*.test.mjs
      - name: Stage public, static-only files
        run: |
          mkdir -p _public/data
          cp index.html _public/index.html
          cp -r src assets _public/
          cp -r data/legal data/templates _public/data/
          test -f _public/index.html
          test -f _public/src/app.js
          test -f _public/data/legal/MEP_XD_official_catalog.json
          test -f _public/data/legal/MEP_XD_tvpl_candidates.json
          test ! -d _public/backend
          test ! -f _public/.env
      # The owner must first enable Settings > Pages > Source: GitHub Actions.
      # Do not auto-create a Pages site with GITHUB_TOKEN (permission denied).
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4