name: Publish Web 3D (Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public-only static preview
        run: |
          mkdir -p _public
          cp index.html _public/
          cp -r src assets data versions _public/
          rm -rf _public/data/samples
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - id: deployment
        uses: actions/deploy-pages@v4
