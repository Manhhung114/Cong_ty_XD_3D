name: Publish login-only landing page (Pages)

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'src/**'
      - 'assets/**'
      - 'data/legal/**'
      - 'data/templates/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify web application
        run: node --test tests/*.test.mjs
      - name: Stage public login-only landing page
        run: |
          mkdir -p _public
          cat > _public/index.html <<'HTML'
          <!doctype html>
          <html lang="vi"><head><meta charset="utf-8">
          <meta name="robots" content="noindex,nofollow">
          <meta http-equiv="refresh" content="0;url=https://congtyxd.streamlit.app/">
          <title>Công ty XD &amp; MEP AI 3D · Đăng nhập</title></head>
          <body><p><a href="https://congtyxd.streamlit.app/">Đăng nhập qua Streamlit</a></p></body></html>
          HTML
          test ! -d _public/src
          test ! -d _public/data
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4