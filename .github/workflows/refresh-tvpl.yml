name: Refresh TVPL metadata references – XD and MEPF
on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 2'
permissions:
  contents: write
jobs:
  tvpl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public HTML parser
        run: python -m pip install requests beautifulsoup4
      - name: Discover TVPL public link metadata only, without login
        run: python scripts/refresh_tvpl_candidates.py
      - name: Commit only TVPL candidate links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legal/MEP_XD_tvpl_candidates.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(legal): update unverified TVPL reference links'
          git push
