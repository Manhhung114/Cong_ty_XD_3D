name: Verify V7.5 Canary
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xdtest
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: xdtest
        options: >-
          --health-cmd "pg_isready -U xdtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["6379"]
    env:
      AGENT_RUNTIME_SECRET: "synthetic-fixture-only-runtime-test-secret"
      XD_V750_DISPOSABLE_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt -r agent_runtime/requirements.txt httpx
      - name: Actual PostgreSQL, Redis and Celery with synthetic Drive
        env:
          AGENT_RUNTIME_DATABASE_URL: "postgresql+psycopg://xdtest:fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/xdtest"
          CELERY_BROKER_URL: "redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/1"
        run: python -m agent_runtime.integration.v750_campaign
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.tests.check_v750_browser
      - name: V7.5.2 coordination meeting and fast workflow browser check
        run: python -m scripts.tests.check_v752_browser
